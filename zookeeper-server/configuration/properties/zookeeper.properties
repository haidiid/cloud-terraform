# ---
# a ZooKeeper configuration file designated for local and development deployments only.
# ---

# switches to Netty for serving TLS zookeeper's clients and quorum connection
serverCnxnFactory=org.apache.zookeeper.server.NettyServerCnxnFactory

# ---
# defines mTLS configuration for ZooKeeper clients as detailed below
#    - exposes every ip and port 433 bound to ZooKeeper for serving clients
#    - defines TLS v1.3 and its ciphers specs (disabled by default in ZooKeeper)
#    - defines client authentication required by TLS and ignoring every client's hostname verification
#    - defines Java SE 25 JCA/JSSE specs for TLSv1.3 including
#      a self-signed Root CA in truststore;
#      and server's tls private key, tls certificate, and self-signed Root CA bundled in keystore and
#      formatted in X.509 PKCS#12
# ---
secureClientPort=443
secureClientPortAddress=0.0.0.0

ssl.ciphersuites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256
ssl.protocol=TLSv1.3
ssl.enabledProtocols=TLSv1.3

ssl.clientAuth=need
ssl.hostnameVerification=false

ssl.keyStore.location=/opt/zookeeper/conf/tls/keystore.p12
ssl.keyStore.type=PKCS12
ssl.keyStore.password=zookeeper-server

ssl.trustStore.location=/opt/zookeeper/conf/tls/truststore.p12
ssl.trustStore.type=PKCS12
ssl.trustStore.password=ca

# ---
# defines mTLS configuration for ZooKeeper quorum as detailed below
#    - exposes every ip and port 2888:3888 bound to ZooKeeper for the provisioning quorum member
#    - enable tls for the quorum connection
#    - defines TLS v1.3 and its ciphers specs (disabled by default in ZooKeeper)
#    - defines other quorum authentication and quorum verification required by mTLS
#    - defines Java SE 25 JCA/JSSE specs for TLSv1.3 including
#      a self-signed Root CA in truststore;
#      and server's tls private key, tls certificate, and self-signed Root CA bundled in keystore and
#      formatted in X.509 PKCS#12
# ---
server.1=0.0.0.0:2888:3888

sslQuorum=true
ssl.quorum.protocol=TLSv1.3
ssl.quorum.enabledProtocols=TLSv1.3
ssl.quorum.ciphersuites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256

ssl.quorum.clientAuth=need
ssl.quorum.hostnameVerification=true

ssl.quorum.keyStore.location=/opt/zookeeper/conf/tls/keystore.p12
ssl.quorum.keyStore.type=PKCS12
ssl.quorum.keyStore.password=zookeeper-server

ssl.quorum.trustStore.location=/opt/zookeeper/conf/tls/truststore.p12
ssl.quorum.trustStore.type=PKCS12
ssl.quorum.trustStore.password=ca

# defines ticktime  and session (this one that is in milliseconds and keeps in order)
minSessionTimeout=3000
maxSessionTimeout=6000

# disables the per-ip limit on the number of connections since this is a non-production config
maxClientCnxns=0

# disables admin port
admin.enableServer=false

# ---
# defines ZooKeeper instance's snapshot and transactional log locations
# ---
dataDir=/var/opt/zookeeper/lib/snapshot
dataLogDir=/var/opt/zookeeper/lib/transaction

