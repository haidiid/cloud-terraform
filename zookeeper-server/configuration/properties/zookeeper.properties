# ---
# a ZooKeeper configuration file
# Designated for local and development deployments only.
# ---

# defines quorum members, server.x number denotes it belong quorum member identity referred to myid
server.1=0.0.0.0:2888:3888
# server.2=192.168.18.112:2888:3888

# expose a connection on all ips on the server for clients
# including Kafka brokers and Spring Boot services connected to ZooKeeper's servers
# clientPortAddress=0.0.0.0

# plaintext client port is disabled so every client must use mutual TLS on secureClientPort.
# re-enable only for debugging, port 80 is still open in the security group
# clientPort=80

# --- secure client connection (mutual / two-way TLS) ---
# TLS is only supported by the Netty connection factory, not the default NIO one
serverCnxnFactory=org.apache.zookeeper.server.NettyServerCnxnFactory
# 443 is already allowed by the public security group
secureClientPort=443
secureClientPortAddress=0.0.0.0


ssl.keyStore.location=/opt/zookeeper/conf/tls/keystore.p12
ssl.keyStore.type=PKCS12
ssl.keyStore.password=zookeeper-server

ssl.trustStore.location=/opt/zookeeper/conf/tls/truststore.p12
ssl.trustStore.type=PKCS12
ssl.trustStore.password=ca

# defines to only accept clients with signed TLS certificates trusted CAs inside truststore
ssl.clientAuth=need

# defines to ingore every client hostnames (look up on zookeeper-client.cnf) since it's not required for the security
ssl.hostnameVerification=false

ssl.protocol=TLSv1.3
ssl.enabledProtocols=TLSv1.3

# defines secure quorum members connection
sslQuorum=true
ssl.quorum.keyStore.location=/opt/zookeeper/conf/tls/keystore.p12
ssl.quorum.keyStore.type=PKCS12
ssl.quorum.keyStore.password=zookeeper-server
ssl.quorum.trustStore.location=/opt/zookeeper/conf/tls/truststore.p12
ssl.quorum.trustStore.type=PKCS12
ssl.quorum.trustStore.password=ca
ssl.quorum.clientAuth=need
ssl.quorum.hostnameVerification=true
ssl.quorum.protocol=TLSv1.3
ssl.quorum.enabledProtocols=TLSv1.3

# ticktime  and session (this one that is in milliseconds and keeps in order)
minSessionTimeout=3000
maxSessionTimeout=6000
# disable the per-ip limit on the number of connections since this is a non-production config
maxClientCnxns=0
# Disable the adminserver by default to avoid port conflicts.
# Set the port to something non-conflicting if choosing to enable this
admin.enableServer=false
# admin.serverPort=8080

# datatree snapshot
dataDir=/var/opt/zookeeper/lib/snapshot
# transaction log
dataLogDir=/var/opt/zookeeper/lib/transaction

