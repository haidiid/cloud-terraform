# ---
# the Kerberos library (libkrb5) configuration on the KDC host, designated for local deployment only.
#
# it is read by every kerberos program in the host: the krb5kdc and kadmind daemons, and the client tools
# (kinit, klist, kadmin) used when administering the realm directly on the server. it covers
#    - [libdefaults]: the default realm HAIDI.ONLINE and client-side defaults (tickets, credential cache),
#      and spake_preauth_groups, which enables SPAKE pre-auth for both the KDC and the clients
#    - [realms]: where clients on this host reach the HAIDI.ONLINE ticket, kadmin and kpasswd ports,
#      and disable_encrypted_timestamp, so clients never fall back to the weaker encrypted timestamp pre-auth
#    - [domain_realm]: maps haidi.online hostnames to the HAIDI.ONLINE realm
#
# KDC-only settings (logging, listening ports, database, encryption types, pre-auth plugins) live in kdc.conf,
# and kadmin permissions in kadm5.acl. remote clients can use a copy of this file as is.
# ---

[libdefaults]
    default_realm             = HAIDI.ONLINE
    dns_lookup_realm          = false
    dns_lookup_kdc            = false
    ticket_lifetime           = 24h
    renew_lifetime            = 7d
    forwardable               = true
    rdns                      = false
    dns_canonicalize_hostname = fallback
    qualify_shortname         = ""
    spake_preauth_groups      = edwards25519
    default_ccache_name       = KEYRING:persistent:%{uid}

[realms]
    HAIDI.ONLINE = {
        kdc                         = kerberos.haidi.online:80
        admin_server                = kerberos.haidi.online:9811
        kpasswd_server              = kerberos.haidi.online:9812
        disable_encrypted_timestamp = true
    }

[domain_realm]
    .haidi.online = HAIDI.ONLINE
    haidi.online  = HAIDI.ONLINE

# included last so the values above win: the first value read for a setting is the one used, and
# AlmaLinux's kcm_default_ccache would otherwise switch default_ccache_name to KCM:, whose sssd-kcm
# service fails at first boot. crypto-policies (allowed encryption types) still applies from here.
includedir /etc/krb5.conf.d/
