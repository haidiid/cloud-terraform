# ---
# a Kerberos KDC server configuration designated for local deployment only.
#
# it defines kerberos kdc server configuration detailed as below
#    - [logging] specifies kdc server logging files
#    - [kdcdefaults] specifies any realm's ticket request port [kdc_listen, kdc_tcp_listen]
#      and sends the SPAKE challenge in the first reply [spake_preauth_kdc_challenge]
#    - [realms] specifies HAIDI.ONLINE realms server configuration, covering
#         - specifies ports for kadmin [kadmind_port] and kpasswd [kpasswd_port]
#         - specifies realm kdc database path and name [database_name]
#         - specifies ACL rules file configuration for kdc database administrators [acl_file]
#         - specifies realm kdc database's master key generated after database created [key_stash_file]
#         - requires pre-authentication for every principal created from now on [default_principal_flags]
#    - [plugins] disables the encrypted timestamp and encrypted challenge pre-auth, leaving SPAKE as the
#      only pre-auth method the KDC accepts
#
# SPAKE itself is enabled by spake_preauth_groups in krb5.conf [libdefaults], which the KDC also reads.
# clients that cannot do SPAKE (Java's built-in Kerberos, Windows SSPI) cannot obtain tickets from this KDC.
# ---
[logging]
    default      = FILE:/var/log/krb5libs.log
    kdc          = FILE:/var/log/krb5kdc.log
    admin_server = FILE:/var/log/kadmind.log

[kdcdefaults]
    kdc_listen                  = 80
    kdc_tcp_listen              = 80
    spake_preauth_kdc_challenge = edwards25519

[realms]
    HAIDI.ONLINE = {
        kadmind_port            = 9811
        kpasswd_port            = 9812
        database_name           = /var/kerberos/krb5kdc/principal
        master_key_type         = aes256-cts-hmac-sha384-192
        key_stash_file          = /var/kerberos/krb5kdc/.k5.HAIDI.ONLINE
        acl_file                = /var/kerberos/krb5kdc/kadm5.acl
        max_life                = 24h
        max_renewable_life      = 7d
        default_principal_flags = +preauth
        supported_enctypes      = aes256-cts-hmac-sha384-192:normal aes128-cts-hmac-sha256-128:normal aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal
    }

[plugins]
    kdcpreauth = {
        disable = encrypted_timestamp
        disable = encrypted_challenge
    }
